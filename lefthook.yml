# 秘密の検査 → Markdown の空白 → 整形 → lint の順に流したいので、parallel にせず jobs の順番で固定する
pre-commit:
  jobs:
    # 秘密が混ざっていたら、整形より先に止める。gitleaks が無ければ飛ばし、CI で調べる
    - name: secrets
      run: |
        if ! command -v gitleaks >/dev/null; then echo "gitleaksが無いので飛ばす（CIで調べる）"; exit 0; fi
        gitleaks git --pre-commit --staged --redact --no-banner
    # 表の中で空白が増えると列の幅が変わるので、整形より先に直す。
    # textlint は npm ci で入る。まだ入れていなければ飛ばし、CI で調べる
    - name: lint md
      glob: "*.md"
      run: |
        if [ ! -x node_modules/.bin/textlint ]; then echo "textlintが無いので飛ばす（CIで調べる）"; exit 0; fi
        node_modules/.bin/textlint --fix {staged_files}
      stage_fixed: true
    # deno が PATH に無くても動くように npx 経由で呼ぶ。
    # Windows では lefthook から呼ぶと deno.json を自動で見つけないことがあるので、明示する
    - name: format
      glob: "*.{ts,js,mjs,json,md,css,html,yml,yaml}"
      exclude:
        - "**/package-lock.json"
        - "deno.lock"
        - "archive/**"
      run: npx -y deno fmt --config deno.json {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,js,mjs}"
      exclude:
        - "archive/**"
      run: npx -y deno lint --config deno.json --fix {staged_files}
      stage_fixed: true
