<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="PlanterAI">
    <title>ホーム｜PlanterAIアプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/home.js"></script>
  </head>
  <body class="home">
    <header class="home-header">
      <div>
        <h1 id="plantName" class="home-header__name">カラ美</h1>
        <p id="plantDays" class="home-header__sub"></p>
      </div>
      <!-- 記録と設定のページは 11/8 に作る。それまでは今のダッシュボードを開く -->
      <nav class="home-header__menu" aria-label="メニュー">
        <a class="home-icon-button" href="/app/dashboard.html" data-keep-query
          aria-label="記録">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="4" y="5" width="16" height="15" rx="1.5"></rect>
            <path d="M4 9.5h16M8.5 3v4M15.5 3v4"></path>
          </svg>
        </a>
        <a class="home-icon-button" href="/app/dashboard.html" data-keep-query
          aria-label="設定">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path>
          </svg>
        </a>
      </nav>
    </header>

    <!-- 数値の画面は 11/7 に作る。それまでは今のダッシュボードを開く -->
    <nav id="potSwitcher" class="pot-switcher" aria-label="鉢を選ぶ"
      hidden></nav>

    <div class="view-toggle">
      <span class="view-toggle__item is-active"
        aria-current="page">キャラ</span>
      <a class="view-toggle__item" href="/app/dashboard.html"
        data-keep-query>数値</a>
    </div>

    <dl class="home-status">
      <div class="home-status__cell">
        <dt>今の気分</dt>
        <dd id="statusMood" class="home-status__value">—</dd>
        <dd id="statusMoodNote" class="home-status__note"></dd>
      </div>
      <div class="home-status__cell">
        <dt>土の水分</dt>
        <dd id="statusMoisture" class="home-status__value">—</dd>
      </div>
      <div class="home-status__cell">
        <dt>最後の水やり</dt>
        <dd id="statusWatering" class="home-status__value">—</dd>
      </div>
    </dl>

    <main class="home-stage">
      <div id="karamiStage" class="karami-stage">
        <div id="karamiBubble" class="karami-bubble" aria-live="polite"></div>
        <p id="karamiLoading" class="karami-loading">カラ美を呼んでいます…</p>
        <!-- 3D を表示できないときだけ出す -->
        <img id="karamiImg" class="karami-stage__img" src="/images/karami.png"
          alt="カラ美" hidden />
      </div>
      <!-- ステージは iPhone の拡大を止めるために touchend を止めているので、ボタンはその外に置く -->
      <button id="bubbleRecall" class="bubble-recall" type="button"
        aria-label="最後のセリフを見る" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M4 5.5h16v10H10l-4 3.5v-3.5H4z"></path>
          <path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.4"
            stroke-linecap="round"></path>
        </svg>
      </button>
      <p
        class="karami-hint">タップでつつく・頭をなでる・体を回す・長押しで持ち上げる</p>
    </main>

    <form id="chatForm" class="home-chat">
      <label class="sr-only" for="chatInput">カラ美に話しかける</label>
      <input id="chatInput" type="text" placeholder="カラ美に話しかける"
        maxlength="500" autocomplete="off" required />
      <button type="submit" aria-label="送信">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6"></path>
        </svg>
      </button>
    </form>
  </body>
</html>
