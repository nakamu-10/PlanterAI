<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>チャット｜PlanterAIアプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
<script type="module" src="/src/chat.js"></script>
</head>
<body>

<nav class="app-nav">
  <a class="app-nav__brand" href="/index.html">
    <img src="/images/karami.png" alt="" />
    PlanterAI
  </a>
  <a class="app-nav__link" href="/app/index.html">ダッシュボード</a>
  <a class="app-nav__link is-active" href="/app/chat.html">チャット</a>
  <a class="app-nav__link" href="/app/karami.html">カラ美</a>
</nav>

<div class="app-shell">

  <header class="app-header">
    <div class="app-header__eyebrow">CHAT</div>
    <h1>カラ美とお話しする</h1>
    <p>話しかけると、いまの状態に合わせて返事をします。LINEと同じ会話履歴を共有しています。</p>
  </header>

  <section class="app-panel">
    <ul id="chatList" class="chat-list"></ul>
  </section>

  <form id="chatForm" class="chat-form">
    <input id="chatInput" type="text" placeholder="話しかけてみる…" maxlength="500" autocomplete="off" required />
    <button type="submit">送信</button>
  </form>

  <footer class="app-footer">PlanterAI専用アプリ — 電気通信大学　U☆PoC 2026</footer>

</div>

</body>
</html>
