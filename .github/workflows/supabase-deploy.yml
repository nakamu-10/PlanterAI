# 本番の Supabase に、マイグレーションと Edge Functions を入れる（ADR 0011）。
# main に supabase/ の変更が入ると、入るマイグレーションを書き出して止まり、
# production 環境の承認を待ってから、マイグレーション → 関数（全部）の順に入れる
name: supabase-deploy

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

# 続けてマージしても、前のデプロイが終わるまで次は待つ
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
  # 3.0 でオプションの名前が変わった（--project-ref → --remote）ので、2.x の安定版に固定する
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  # 鍵を登録するまでは、失敗にせず飛ばす
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase の鍵が登録されていないので、デプロイしません（README の「本番へのデプロイ」）。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 承認する人が、何が入るかを読んでから押せるように書き出す
  plan:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: |
          {
            echo "## 入るマイグレーション"
            echo '```'
            supabase db push --dry-run 2>&1
            echo '```'
            echo "## 入れ直す関数"
            for dir in supabase/functions/*/; do
              name=$(basename "$dir")
              [ "$name" = _shared ] || echo "- $name"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: plan
    # 手で動かすときは main 以外のブランチも選べる。マージ前のものは本番に入れない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Settings → Environments の production に、承認する人を設定しておく
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # マイグレーションを先に入れる。新しい列や表を使う関数が、先に動かないように
      - run: supabase db push --yes
      # _shared/ はデプロイのときにバンドルされるので、いつも全部の関数を入れ直す
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --yes
