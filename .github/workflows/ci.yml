name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI では git フックを入れない
  LEFTHOOK: 0

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.6
      - run: deno fmt --check
      - run: deno lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      # textlint は npm の依存なので、npm ci をしたこの job で調べる
      - run: npm run lint:md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            app/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - run: npm ci --prefix app
      - run: npm run build --prefix app

  # 秘密が混ざっていないかを履歴ごと調べる。公開リポジトリなら push した時点で誰でも見られる
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
